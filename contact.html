    <body>
        <header>
            <nav>
                <img src="images/logo-icon-only.png" alt="logo" style="width:40px;height:40px">
                <a href="index.html">Home</a> |

        </header>
        <h1>This is Contact Page</h1>
        <main>
            <section class="contact_form">
                <fieldset>
                    <legend>Contact Form </legend>
                    <form>
                        <label for="name">Enter Name: </label>
                        <input type="text" placeholder="Enter Name" />

                        <br><br>
                        <label for="email">Enter Email: </label>
                        <input type="email" placeholder="Enter Email" />

                        <br><br>
                        <label for="phone">Enter Phone Number: </label>
                        <input type="number" placeholder="Enter Phone number" />

                        <br><br>
                        <label>Choose Gender</label>
                        <input type="radio" name="gender">Male
                        <input type="radio" name="gender">Female
                        <input type="radio" name="gender">Other

                        <br><br>
                        <label for="comment">Comment:</label>
                        <textarea rows="5" cols="20"></textarea>

                        <br><br>
                        <input type="submit" value="Submit Form">
                    </form>
                </fieldset>
            </section>
            <br><hr>
            <section>
                <h2>Our Address: </h2>
                <iframe
                    src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3780.8244709017295!2d73.80228421571053!3d18.626963186259847!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3bc2b9424b44386f%3A0x7bcf6e817a60a636!2sFortune%20Cloud%20Technologies%20Pimpri!5e0!3m2!1sen!2sin!4v1787041623457!5m2!1sen!2sin"
                    width="600" height="450" style="border:0;" allowfullscreen
                    loading="lazy"
                    referrerpolicy="strict-origin-when-cross-origin"></iframe>
            </section>
        </main>
        <br><br>
        <footer>
            <p class="foot">Car Dealership &copy; 2026 </p>
        </footer>
        <br>
    </body>
