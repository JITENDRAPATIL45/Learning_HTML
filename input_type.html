<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Input Type Example</title>
    </head>
    <body>
        <h1>Input type Example</h1>
        <form>
            <label for="name">Enter Name: </label>
            <input type="text" placeholder="Enter Name" />

            <br><br>
            <label for="email">Enter Email: </label>
            <input type="email" placeholder="Enter Email" />

            <br><br>
            <label for="phone">Enter Name: </label>
            <input type="number" placeholder="Enter Phone number" />

            <br><br>
            <label for="password">Enter Password</label>
            <input type="password" placeholder="Enter password" />

            <br><br>
            <label for="dob">Enter Dob</label>
            <input type="date" />

            <br><br>
            <label for="month">Enter Month</label>
            <input type="month" />

            <br><br>
            <label for="week">Enter Week</label>
            <input type="week" />

            <br><br>
            <label for="time">Enter Time</label>
            <input type="time" />

            <br><br>
            <label for="date&time">Enter Date and Time</label>
            <input type="datetime-local" />

            <br><br>
            <label>Choose city</label>
            <input type="checkbox">Mumbai
            <input type="checkbox">Pune
            <input type="checkbox">Jalgaon

            <br><br>
            <label>Choose Gender</label>
            <input type="radio" name="gender">Male
            <input type="radio" name="gender">Female
            <input type="radio" name="gender">Other

            <br><br>
            <label>Select color</label>
            <input type="color">

            <br><br>
            <label>Select Range</label>
            <input type="range">

            <br><br>
            <label>Upload docs</label>
            <input type="file">

            <br><br>
            <label>Upload multiple Files</label>
            <input type="file" multiple>

            <br><br>
            <label>Enter URL</label>
            <input type="url">

            <br><br>
            <label>Search</label>
            <input type="search" placeholder="Search Anything">

            <br><br>
            <label for>Telephone</label>
            <input type="tel" placeholder="25461">

            <br><br>
            <select name id>
                <option value>Jalgaon</option>
                <option value>Mumbai</option>
                <option value>Pune</option>
            </select>

            <br><br>
            <label for>Enter Address</label>
            <textarea rows="5" cols="20"></textarea>

            <br><br>
            <input type="submit" value="Submit Form">
            <input type="submit" value="Submit Form">
            <input type="reset" value="reset Form">
        </form>
    </body>
</html>
