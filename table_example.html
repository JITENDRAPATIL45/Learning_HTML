<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>table Example 2</title>
    </head>
    <body>
        <h1>Table Rowspan </h1>
        <table border="2">
            <thead>
                <tr>
                    <th>Language</th>
                    <th>Details</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td rowspan="5">Web design</td>
                    <td>HTML</td>
                </tr>
                <tr>
                    <td>CSS</td>
                </tr>
                <tr>
                    <td>JS</td>
                </tr>
                <tr>
                    <td>Bootsrap</td>
                </tr>
                <tr>
                    <td>React</td>
                </tr>
                <tr>
                    <td rowspan="4">BackEnd</td>
                    <td>Java</td>
                </tr>
                <tr>
                    <td>Python</td>
                </tr>
                <tr>
                    <td>PHP</td>
                </tr>
                <tr>
                    <td>Dot Net</td>
                </tr>
            </tbody>
        </table>
        <hr>
        <hr>

        <table border="2">
            <thead>
                <tr>
                    <th colspan="4">Web Design</th>
                    <th colspan="3">Back end</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>HTML</td>
                    <td>CSS</td>
                    <td>Js</td>
                    <td>Bootsrap</td>
                    <td>Java</td>
                    <td>Dot Net</td>
                    <td>Python</td>
                </tr>
            </tbody>
        </table>
    </body>
</html>
