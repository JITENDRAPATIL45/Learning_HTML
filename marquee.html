<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>marquee </title>
</head>
<body>
    <h1>Marquee </h1>
    <marquee direction="right" bgcolor="aquamarine">
        <h2>welcome to my site</h2>
    </marquee>
    <marquee direction="right" scrolldelay="200" bgcolor="aquamarine">
        <h2>welcome to my site</h2>
    </marquee>
    <marquee direction="right" scrollamount="20" bgcolor="aquamarine">
        <h2>welcome to my site</h2>
    </marquee>
    <marquee direction="down" bgcolor="aquamarine" height="300px">
        <h2>welcome to my web site</h2>
    </marquee>
</body>
</html>
